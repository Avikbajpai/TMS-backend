server:
  port: ${PORT:8080}
  
spring:
  datasource:
    url: jdbc:h2:file:./data/nexustms
    driverClassName: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console